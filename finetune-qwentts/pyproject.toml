[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheng-qwentts"
version = "0.1.0"
description = "Fine-tune Qwen3-TTS-12Hz-0.6B-Base to speak Sheng (Swahili + English) on Colab"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyarrow>=14",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sheng-qwentts = "sheng_qwentts.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["sheng_qwentts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
