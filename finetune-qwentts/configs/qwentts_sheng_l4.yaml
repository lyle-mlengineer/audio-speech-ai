# Qwen3-TTS 0.6B on Sheng - reference template for profile l4.
#
# `sheng-qwentts train` does NOT read this file: it renders the settings it
# passes to `python -m sheng_qwentts.train` from src/sheng_qwentts/config.py::PROFILES,
# so paths always point at the live artifacts root and CLI flags win.
# The rendered copy is written to <artifacts>/configs/<run>.yaml; tests/test_config.py
# asserts the keys in these templates stay in sync with what is rendered.
#
# ${ARTIFACTS} = artifacts root (Google Drive on Colab).
#
run: sheng_06b
profile: l4
# effective batch = batch_size * grad_accum (fixed at 4)
batch_size: 2
grad_accum: 2
steps: 240
learning_rate: 0.000002
weight_decay: 0.01
warmup_steps: 20
max_grad_norm: 1.0
log_interval: 1
save_interval: 40
keep_last: 3
sub_talker_loss_weight: 0.3
speaker_name: abel
dtype: bfloat16
attn: sdpa
seed: 1337
tensorboard: true

# resolved paths (artifacts root: ${ARTIFACTS})
model_dir: ${ARTIFACTS}/pretrained/qwen3-tts-0.6b-base
tokenizer_dir: ${ARTIFACTS}/pretrained/qwen3-tts-tokenizer-12hz
train_jsonl: ${ARTIFACTS}/manifests/train_with_codes.jsonl
save_dir: ${ARTIFACTS}/checkpoints/sheng_06b
