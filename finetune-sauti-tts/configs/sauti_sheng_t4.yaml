# Sauti TTS on Sheng - reference template for profile t4 (16 GB, tight).
#
# Requires `--allow-small-gpu`. Rendered configs live in
# <artifacts>/configs/<run>.yaml; this file is only a human-readable template.
#
run: sheng_abel
profile: t4
# effective batch = batch_size * grad_accum (fixed at 4 samples)
batch_size: 1
grad_accum: 4
epochs: 200
learning_rate: 0.00001
warmup_updates: 100
save_per_updates: 200
last_per_updates: 50
keep_last: 3
max_grad_norm: 1.0
mixed_precision: fp16
max_samples: 1
min_vram_gb: 14.0
allow_small_gpu: true

# resolved paths (artifacts root: ${ARTIFACTS})
pretrained: ${ARTIFACTS}/pretrained/sauti-tts/sauti_ema.pt
dataset_dir: ${ARTIFACTS}/data/f5
vocab: ${ARTIFACTS}/data/f5/vocab.txt
checkpoint_dir: ${ARTIFACTS}/checkpoints/sheng_abel
