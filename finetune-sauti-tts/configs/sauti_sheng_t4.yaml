# Sauti TTS on Sheng - reference template for profile t4 (Colab free tier).
#
# This is the DEFAULT runtime. `sauti-sheng setup` suggests it on a T4 and
# `sauti-sheng train` uses it with no extra flags (no --allow-small-gpu needed).
# 16 GB, Turing sm75: one 30 s sample per forward pass and fp16, because T4 has
# no bf16.
#
# `sauti-sheng train` does NOT read this file: it renders the settings from
# src/sauti_sheng/config.py::PROFILES and passes them to
# `python -m sauti_sheng.train`. The rendered copy lands in
# <artifacts>/configs/<run>.yaml; tests/test_config.py keeps the keys in sync.
#
# ${ARTIFACTS} = artifacts root (Google Drive on Colab).
#
run: sheng_abel
profile: t4
# effective batch = batch_size * grad_accum (fixed at 4 samples)
batch_size: 1
grad_accum: 4
epochs: 200
learning_rate: 0.00001
warmup_updates: 100
save_per_updates: 200
last_per_updates: 50
keep_last: 3
max_grad_norm: 1.0
mixed_precision: fp16
max_samples: 1
min_vram_gb: 14.0

# resolved paths (artifacts root: ${ARTIFACTS})
pretrained: ${ARTIFACTS}/pretrained/sauti-tts/sauti_ema.pt
dataset_dir: ${ARTIFACTS}/data/f5
vocab: ${ARTIFACTS}/data/f5/vocab.txt
checkpoint_dir: ${ARTIFACTS}/checkpoints/sheng_abel
