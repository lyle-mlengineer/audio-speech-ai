# Sauti TTS on Sheng - reference template for profile a100.
#
# Rendered configs live in <artifacts>/configs/<run>.yaml; this file is only a
# human-readable template and is never loaded by the trainer.
#
run: sheng_abel
profile: a100
# effective batch = batch_size * grad_accum (fixed at 4 samples)
batch_size: 4
grad_accum: 1
epochs: 150
learning_rate: 0.00001
warmup_updates: 100
save_per_updates: 250
last_per_updates: 100
keep_last: 3
max_grad_norm: 1.0
mixed_precision: bf16
max_samples: 4
min_vram_gb: 35.0

# resolved paths (artifacts root: ${ARTIFACTS})
pretrained: ${ARTIFACTS}/pretrained/sauti-tts/sauti_ema.pt
dataset_dir: ${ARTIFACTS}/data/f5
vocab: ${ARTIFACTS}/data/f5/vocab.txt
checkpoint_dir: ${ARTIFACTS}/checkpoints/sheng_abel
