[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sauti-sheng"
version = "0.1.0"
description = "Fine-tune MsingiAI's Sauti TTS (F5-TTS v1 Base) to speak Sheng on Colab"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyarrow>=14",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["f5-tts==1.1.22"]

[project.scripts]
sauti-sheng = "sauti_sheng.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["sauti_sheng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
