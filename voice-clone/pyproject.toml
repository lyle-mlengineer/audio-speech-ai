[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheng-voiceclone"
version = "0.1.0"
description = "Measure-first voice cloning for Sheng (Swahili + English) on Colab"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyarrow>=14",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sheng-voiceclone = "sheng_voiceclone.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["sheng_voiceclone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
