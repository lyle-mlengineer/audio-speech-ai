# VoxCPM2 LoRA on Sheng (Swahili + English) - reference template, A100 40/80 GB.
# Same notes as voxcpm2_sheng_lora_l4.yaml: the rendered config comes from
# src/sheng_voxcpm/config.py, this file only documents it.
#
# ${ARTIFACTS} = artifacts root (Google Drive on Colab).

pretrained_path: ${ARTIFACTS}/pretrained_models/VoxCPM2
train_manifest: ${ARTIFACTS}/manifests/train.jsonl
val_manifest: ${ARTIFACTS}/manifests/val.jsonl

sample_rate: 16000
out_sample_rate: 48000

# Effective batch still 16 - bigger micro-batch, fewer accumulation steps.
batch_size: 4
grad_accum_steps: 4
max_batch_tokens: 16384
num_workers: 8
preprocessing_num_workers: 8

num_iters: 600
max_steps: 600
log_interval: 10
valid_interval: 100
save_interval: 100

learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 50
max_grad_norm: 1.0

save_path: ${ARTIFACTS}/checkpoints/lora_r32
tensorboard: ${ARTIFACTS}/logs/lora_r32/tensorboard

lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0

distribute: false
