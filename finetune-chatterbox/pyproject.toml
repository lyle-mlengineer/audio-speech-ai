[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheng-chatterbox"
version = "0.1.0"
description = "Chatterbox T3 fine-tuning pipeline for Sheng (Swahili + English) on Colab"
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sheng-chatterbox = "sheng_chatterbox.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["sheng_chatterbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
